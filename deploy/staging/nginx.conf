user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log emerg;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;
    server_tokens off;
    sendfile off;
    tcp_nopush on;

    # PRIV-02 / NGX-2026-08-07-E-003. This is a closed operational event,
    # not a general access log: hour granularity, constant route class and the
    # two refusal statuses are the entire producer universe.
    map $time_iso8601 $private_alpha_event_hour {
        ~^([0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]T[0-9][0-9]) $1;
        default 0000-00-00T00;
    }
    map "$status:$private_alpha_route_class" $private_alpha_outcome_loggable {
        default 0;
        "429:chart" 1;
        "429:places" 1;
        "429:static" 1;
        "503:chart" 1;
        "503:places" 1;
        "503:static" 1;
    }
    log_format private_alpha_outcome
        '$private_alpha_event_hour $private_alpha_route_class $status';

    include /etc/nginx/conf.d/private-alpha.conf;
}
