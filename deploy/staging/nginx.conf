user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log emerg;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;
    server_tokens off;
    sendfile off;
    tcp_nopush on;

    # The edge and the application must agree on what a path is: the bounded
    # API locations match by regex while the application classifies by exact
    # string. Path normalization is nginx's default, but a default is not a
    # decision — stated here it is verifiable, and verify_staging_config
    # requires it.
    merge_slashes on;

    include /etc/nginx/conf.d/private-alpha.conf;
}
