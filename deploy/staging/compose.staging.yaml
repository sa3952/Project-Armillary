# Private Alpha staging topology.
#
# The application container stays on the `internal: true` network so it has no
# route to the Internet, which is what keeps submitted birth data from leaving
# the host. Docker cannot publish ports for a container attached only to an
# internal network, so there is deliberately no `ports:` mapping here; the host
# NGINX reaches the container directly on the pinned address below.
#
# See DEP-EXEC-E-005 in
# docs/operations/deployment/EXACT_STAGING_EXECUTION_FINDINGS_2026-07-31.md.
#
# The address is pinned rather than dynamic because the host NGINX upstream
# refers to it literally. Changing it here requires changing
# deploy/staging/nginx-site.conf.template in the same commit.
services:
  private-alpha-app:
    restart: unless-stopped
    networks:
      private-alpha-internal:
        ipv4_address: 172.31.240.2

networks:
  private-alpha-internal:
    internal: true
    ipam:
      config:
        - subnet: 172.31.240.0/28
          gateway: 172.31.240.1
