services:
  private-alpha-app:
    # Runtime only; release images come from the governed materialized context.
    image: "classical-astrology-private-alpha:${IMAGE_TAG:-local}"
    init: true
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777"
    cap_drop:
      - "ALL"
    security_opt:
      - "no-new-privileges:true"
    # Two 40-thread workers plus supervisor/init/probes with bounded headroom.
    pids_limit: 192
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    logging:
      driver: "local"
      options:
        max-size: "5m"
        max-file: "2"
    # Conservative process FD ceiling; leak detection remains an image test.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - "private-alpha-internal"
    stop_grace_period: 30s

networks:
  private-alpha-internal:
    internal: true
