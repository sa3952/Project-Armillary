name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hosted-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: /tmp/classical-astrology-pycache
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Publication boundary before hosted writers
        run: bash scripts/publication/verify_candidate_clean.sh --root .
      - name: Install test dependencies
        run: >-
          python -m pip install --require-hashes
          --requirement backend/requirements-dev.lock
      - name: Privacy dependency boundary
        run: python -m scripts.verification.verify_privacy_dependencies --check
      - name: Hosted Python tests
        run: python -m pytest tests -q
      - name: Frontend tests
        run: |
          frontend_tests=(frontend/tests/*.test.cjs)
          test -e "${frontend_tests[0]}" || {
            echo "frontend test universe is empty" >&2
            exit 1
          }
          node --test "${frontend_tests[@]}"
      - name: Python compile
        run: python -m compileall -q backend/app scripts
      - name: Publication boundary after hosted writers
        run: bash scripts/publication/verify_candidate_clean.sh --root .
