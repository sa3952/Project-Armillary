name: Production amd64 runtime

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/production-amd64.yml"
      - "backend/**"
      - "deploy/**"
      - "scripts/**"
      - "third_party/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-amd64.yml"
      - "backend/**"
      - "deploy/**"
      - "scripts/**"
      - "third_party/**"

# Repository/organization setting required before enabling this workflow:
# Actions log retention: 7 days. The workflow uploads no artifacts and prints
# only a closed summary; GitHub job logs remain a separate remote data layer.

permissions:
  contents: read

concurrency:
  group: production-amd64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: /tmp/classical-astrology-pycache
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Publication boundary
        run: bash scripts/publication/verify_candidate_clean.sh --root .

      - name: Privacy dependency boundary
        run: python3 -m scripts.verification.verify_privacy_dependencies --check

      - name: Native amd64 production runtime and resilience
        run: |
          python3 -m scripts.verification.build_release_image \
            --image classical-astrology-data:ci-amd64 \
            --platform linux/amd64 \
            --purpose diagnostic \
            --evidence-dir /tmp/classical-astrology-build-evidence \
            --require-clean
          # Every flag below is one the module's parser declares; an
          # undeclared flag exits 2 before any runtime check runs.
          python3 -m scripts.verification.verify_container_runtime \
            --image classical-astrology-data:ci-amd64 \
            --platform linux/amd64 \
            --quiet

      - name: Publication boundary after hosted writers
        run: bash scripts/publication/verify_candidate_clean.sh --root .
